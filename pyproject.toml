[project]
name = "autodoc"
version = "0.2.0"
description = "AutoDOC documentation engine (standard-library runtime)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pre-commit>=3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "engine.extractors"]
