repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
-   repo: local
    hooks:
    -   id: doc-frontmatter-check
        name: Validate Frontmatter
        entry: python scripts/validate/frontmatter_validator.py
        language: system
        types: [markdown]
    -   id: doc-drift-check
        name: Check Documentation Drift
        entry: python scripts/doc-sync/check-doc-drift.py
        language: system
        pass_filenames: false
    -   id: doc-state-sync
        name: Auto-update living state
        entry: python scripts/doc-sync/update-doc-state.py
        language: system
        pass_filenames: false
